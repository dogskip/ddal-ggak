[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddalggak"
version = "2.0.0"
description = "Evidence-based verification for AI-assisted repository changes, with sealed records, offline replay and image-to-code tools."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["ai", "coding", "langgraph", "llm", "automation", "mcp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.27.0,<1.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "langgraph>=1.2.9,<2.0.0",
    "structlog>=24.0.0,<26.0.0",
    "gitpython>=3.1.60,<4.0.0",
    "anthropic>=0.120.0,<1.0.0",
    "rich>=13.0.0,<14.0.0",
    "mcp>=1.30.0,<2.0.0",
    "Pillow>=12.3.0,<13.0.0",
    "tenacity>=8.0.0,<10.0.0",
    "playwright>=1.49.0,<2.0.0",
    "jsonschema>=4.23.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0,<1.0.0",
    "pyright>=1.1.380",
    "pytest-playwright>=0.5.0",
    "pip-audit>=2.7.0",
    "mypy>=2.4.0",
    "types-jsonschema>=4.26.0.20261006",
]

[project.scripts]
ddk = "ddk.cli:app"

[project.urls]
Homepage = "https://github.com/dogskip/ddal-ggak"
Documentation = "https://github.com/dogskip/ddal-ggak/blob/main/docs/USER-GUIDE.md"
Changelog = "https://github.com/dogskip/ddal-ggak/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/dogskip/ddal-ggak/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ddk"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/ddal-ggak-clean",
    "/evidence",
    "/.planning",
    "/docs/design",
    "/docs/superpowers",
    "/docs/launch",
    "/test-results",
    "/playwright-report",
]

[tool.hatch.build.targets.wheel.sources]
"src/ddk/assets" = "ddk/assets"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "docker: opt-in local Docker execution with prebuilt immutable images",
    "integration: real API calls — requires ANTHROPIC_API_KEY",
    "playwright: requires Playwright + browser binaries (skip in CI with -m 'not playwright')",
]
filterwarnings = [
    "ignore:Core Pydantic V1:UserWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares options as argument defaults, and ``t`` only looks up a message.
extend-immutable-calls = ["typer.Option", "typer.Argument", "ddk.i18n.t"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"

[tool.mypy]
python_version = "3.12"
strict = true
