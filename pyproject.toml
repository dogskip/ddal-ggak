[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddalggak"
version = "1.0.0"
description = "AI 코딩 워크플로우 — generate → validate → auto-fix closed loop"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["ai", "coding", "langgraph", "llm", "automation", "mcp", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.15.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "structlog>=24.0.0,<26.0.0",
    "gitpython>=3.1.40,<4.0.0",
    "anthropic>=0.40.0,<1.0.0",
    "rich>=13.0.0,<14.0.0",
    "mcp>=1.0.0,<2.0.0",
    "Pillow>=12.1.1,<13.0.0",
    "tenacity>=8.0.0,<10.0.0",
]

[project.optional-dependencies]
visual = [
    "playwright>=1.44.0,<2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0,<1.0.0",
    "pyright>=1.1.380",
    "pytest-playwright>=0.5.0",
    "playwright>=1.44.0,<2.0.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
ddk = "ddk.cli:app"

[project.urls]
Homepage = "https://github.com/bjchoi/ddalggak"
Documentation = "https://github.com/bjchoi/ddalggak/blob/main/docs/USER-GUIDE.md"
Changelog = "https://github.com/bjchoi/ddalggak/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/bjchoi/ddalggak/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ddk"]

[tool.hatch.build.targets.wheel.sources]
"src/ddk/assets" = "ddk/assets"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: real API calls — requires ANTHROPIC_API_KEY",
    "playwright: requires Playwright + browser binaries (skip in CI with -m 'not playwright')",
]
filterwarnings = [
    "ignore:Core Pydantic V1:UserWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"
