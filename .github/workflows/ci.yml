name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check src/ tests/ scripts/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ scripts/
      - name: Strict mypy type check
        run: uv run mypy src/ddk
      - name: Pyright type check
        run: uv run pyright src/

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run tests (excluding opt-in browser and Docker tests)
        run: uv run pytest tests/ -q -m "not playwright and not docker" --tb=short --cov=src/ddk --cov-report=term-missing

  package:
    name: Build & install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Build
        run: uv build
      - name: Check runtime assets and exclude private material from wheel and source archive
        run: python3 scripts/check_wheel.py dist/*
      - name: Install it into a clean environment and start the CLI
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-env"
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" dist/*.whl
          "$RUNNER_TEMP/wheel-env/bin/ddk" --help
          "$RUNNER_TEMP/wheel-env/bin/ddk" demo --help
          "$RUNNER_TEMP/wheel-env/bin/ddk" change --help
          "$RUNNER_TEMP/wheel-env/bin/python" -c 'from ddk.models.verified_change import contract_validator; contract_validator()'
          "$RUNNER_TEMP/wheel-env/bin/python" -m ddk version

  e2e:
    name: End-to-end (real npm, Chromium, screenshot comparison)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Install headless Chromium and its system libraries
        run: uv run python -m playwright install --with-deps --only-shell chromium
      - name: Run the whole loop for real
        env:
          DDK_E2E: "1"
        run: uv run pytest tests/e2e -m playwright -q --tb=short

  security-audit:
    name: Security Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Audit dependencies for known CVEs
        run: uv run pip-audit --ignore-vuln CVE-2026-4539
